name: 问题反馈
description: 命中提示 / 伤害数字 / 击杀卡片 / 音效不正常，或者插件没有反应
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**先看一眼 [README 的常见问题](https://github.com/ChenRuoT/AyaHitmarker#常见问题)**，
        再确认下面几点：
        - 下载的是 Release 里的 **AyaHitmarker-v版本号-EFT-1.2.0.0.zip**，不是 GitHub 的 Source code；
        - `AyaHitmarker.dll` 位于 `BepInEx/plugins/AyaHitmarker/`，没有多套一层版本名目录。

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 日志里 `Loading [AyaHitmarker x.y.z]` 那一行，或 Release 文件名。
      placeholder: 例如 0.5.1
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: 游戏 / SPT 版本
      description: EFT build 号与 SPT 版本。插件只在 EFT 1.2.0.0（build 47965）+ SPTushonka 5.x 上验证过。
      placeholder: 例如 EFT 1.2.0.0 build 47965 / SPTushonka 5.x
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 哪里不正常
      options:
        - 命中标记
        - 伤害数字
        - 击杀卡片 / 成就横幅 / 军衔徽章
        - 音效
        - 文字显示成方块或不显示
        - 设置面板（ConfigurationManager）
        - 插件完全没有反应 / 游戏起不来
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 看到了什么、期望看到什么。截图或短视频最有帮助。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 是只在战局里出现，还是主菜单里按 `F8` / `F9` / `F10` 也能复现？改过哪些设置？
      placeholder: |
        1. ……
        2. ……

  - type: textarea
    id: log
    attributes:
      label: 日志片段
      description: |
        `BepInEx/LogOutput.log` 中与 AyaHitmarker 相关的行（搜索 `AyaHitmarker`、`[ui]`、`[audio]`、`[events]`），
        插件崩溃时附上紧跟在 `Error loading [AyaHitmarker` 之后的异常栈。
        需要更多信息时，可在设置里打开 **启用诊断日志** 后复现一次再贴。
        文字显示成方块时，请务必包含 `[ui] 字体 … 中文字形` 那一行。
      render: text
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已经检查并删除了日志中的个人信息和认证信息（Windows 用户名 / 路径、`-token=…`、账号名等）
          required: true
        - label: 我用的是最新 Release，并且已经按上面的说明确认了安装位置
          required: false
